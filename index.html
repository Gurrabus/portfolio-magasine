    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* Windows 95-inspirerad pilpekare */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 16 16'><path d='M0,0 L0,13.5 L3.5,10 L6.5,14.5 L8.5,13.5 L5.5,9 L10.5,9 Z' fill='white' stroke='black' stroke-width='1.2' stroke-linejoin='round'/></svg>") 0 0, auto;
        }

        /* Windows 95 pekfinger-hand för klickbara element och knappar */
        button, .tool-btn, #draw-canvas.active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 16 16'><path d='M5,1 L5,6 L3,6 L3,10 L4,10 L4,13 L11,13 L11,8 L9,8 L9,4 L7,4 L7,1 Z' fill='white' stroke='black' stroke-width='1.2' stroke-linejoin='round'/></svg>") 5 1, pointer !important;
        }

        #book-container {
            width: 95vw;
            height: 80vh;
            max-width: 1100px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.08));
            position: relative;
        }

        #book {
            box-shadow: 
                inset 0 0 0 1px rgba(0, 0, 0, 0.05),
                -3px 0 5px rgba(0, 0, 0, 0.03),
                3px 0 5px rgba(0, 0, 0, 0.03);
        }

        /* Rit-canvas ovanpå boken */
        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            touch-action: none;
        }
        #draw-canvas.active {
            pointer-events: auto;
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }
        
        .page--left::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to left, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }
        .page--right::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to right, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Windows 95 / MS Paint-inspirerat verktygsfält */
        #toolbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 6px;
            background: #c0c0c0;
            padding: 6px;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .tool-btn {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            padding: 6px 14px;
            font-size: 12px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            font-weight: bold;
            color: #000000;
            outline: none;
            transition: none; /* Klassisk Win95 har inga mjuka animationer */
        }

        .tool-btn:hover {
            background: #c0c0c0;
        }

        /* Intryckt effekt när knappen är aktiv eller trycks ner */
        .tool-btn:active, .tool-btn.active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 7px 13px 5px 15px; /* Skiftar texten lite lätt för äkta 3D-känsla */
            background: #dfdfdf;
        }
    </style>

    <!-- Win95 / Paint Verktygsfält -->
    <div id="toolbar">
        <button id="pen-toggle" class="tool-btn">✏️ Sketch</button>
        <button id="clear-canvas" class="tool-btn" style="display:none;">Clear</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const bookElement = document.getElementById('book');
            const container = document.getElementById('book-container');
            const canvas = document.getElementById('draw-canvas');
            const ctx = canvas.getContext('2d');
            const penToggle = document.getElementById('pen-toggle');
            const clearBtn = document.getElementById('clear-canvas');

            let isDrawingMode = false;
            let isDrawing = false;

            function initCanvasSize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            window.addEventListener('resize', initCanvasSize);
            initCanvasSize();

            penToggle.addEventListener('click', () => {
                isDrawingMode = !isDrawingMode;
                if (isDrawingMode) {
                    canvas.classList.add('active');
                    penToggle.classList.add('active');
                    penToggle.textContent = '👆 Flip';
                    clearBtn.style.display = 'inline-block';
                } else {
                    canvas.classList.remove('active');
                    penToggle.classList.remove('active');
                    penToggle.textContent = '✏️ Sketch';
                    clearBtn.style.display = 'none';
                }
            });

            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left),
                    y: (e.clientY - rect.top)
                };
            }

            canvas.addEventListener('mousedown', (e) => {
                if (!isDrawingMode) return;
                isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing || !isDrawingMode) return;
                const pos = getPos(e);
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#e63946';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            });

            window.addEventListener('mouseup', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => {
                if (!isDrawingMode) return;
                isDrawing = true;
                const touch = e.touches[0];
                const pos = getPos(touch);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
            });

            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing || !isDrawingMode) return;
                const touch = e.touches[0];
                const pos = getPos(touch);
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#e63946';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchend', () => { isDrawing = false; });

            const pageFlip = new St.PageFlip(bookElement, {
                width: 450,
                height: 640,
                size: "stretch",
                minWidth: 250,
                maxWidth: 800,
                minHeight: 350,
                maxHeight: 1000,
                maxShadowOpacity: 0.4,
                showCover: true,
                drawShadow: true,
                flippingTime: 800,
                usePortrait: true,
                mobileScrollSupport: true,
                startPage: 0
            });

            pageFlip.loadFromHTML(bookElement.querySelectorAll('.page'));
        });
    </script>
