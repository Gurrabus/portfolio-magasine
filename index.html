<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Portfolio Magazine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OCR A Extended';
            src: local('OCR A Extended'), local('OCRAExtended');
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            background-size: 200% 200%;
            animation: bgShift 25s ease infinite;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            transition: background 0.4s ease;
        }

        /* MÖRKT TEMA (STUDIO MODE) */
        body.dark-theme {
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%) !important;
            animation: none;
        }

        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }

        body {
            cursor: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background-color: #111827;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease, background-color 0.3s ease;
        }

        body.dark-theme #custom-cursor {
            background-color: #ffffff;
        }

        #book-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            overflow: hidden;
        }

        #book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.12));
            transform-origin: center center;
            transition: transform 0.05s ease-out, width 0.2s ease, height 0.2s ease;
            touch-action: manipulation;
        }

        /* STORLEKSSTYRNING: UPPSLAG (2 SIDOR) */
        body.mode-spread #book-container {
            height: 85dvh !important;
            width: calc(85dvh * 1.406) !important;
            max-width: 94vw !important;
            max-height: calc(94vw / 1.406) !important;
        }

        /* STORLEKSSTYRNING: ENSTAKA SIDA (1 SIDA) */
        body.mode-single #book-container {
            height: 82dvh !important;
            width: calc(82dvh * 0.703) !important;
            max-width: 90vw !important;
            max-height: calc(90vw / 0.703) !important;
        }

        #book {
            box-shadow: 
                inset 0 0 0 1px rgba(0, 0, 0, 0.05),
                -3px 0 5px rgba(0, 0, 0, 0.03),
                3px 0 5px rgba(0, 0, 0, 0.03);
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }
        
        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.01);
            pointer-events: none;
            display: block;
        }
        
        .page--left::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to left, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }
        .page--right::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to right, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* --- UI CONTROLS DESIGN (OCR A EXTENDED) --- */
        #ui-controls {
            position: fixed;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: flex-start;
            gap: 28px;
            z-index: 10000;
        }

        .ui-icon-btn {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #000000;
            font-family: 'OCR A Extended', 'OCRA', 'Courier New', monospace;
            outline: none;
            transition: color 0.3s ease;
        }

        body.dark-theme .ui-icon-btn {
            color: #ffffff;
        }

        .btn-label {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.15;
            margin-bottom: 8px;
            height: 24px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            white-space: pre-line;
        }

        /* VÄXELKNAPP (STRECKAD KAPSEL) */
        .toggle-track {
            width: 18px;
            height: 38px;
            border: 1px dashed #000000;
            border-radius: 10px;
            position: relative;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        body.dark-theme .toggle-track {
            border-color: #ffffff;
        }

        .toggle-thumb {
            width: 14px;
            height: 14px;
            background-color: #000000;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
        }

        body.dark-theme .toggle-thumb {
            background-color: #ffffff;
        }

        /* AKTIVT LÄGE FÖR TOGGLE (CIRKELN GLIDER NER) */
        .ui-icon-btn.active .toggle-thumb {
            transform: translateY(20px);
        }

        /* NEDLADDNINGSKNAPP (ENKEL CIRKEL) */
        .btn-dot-wrapper {
            width: 18px;
            height: 38px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 1px;
        }

        .btn-dot {
            width: 14px;
            height: 14px;
            background-color: #000000;
            border-radius: 50%;
            transition: transform 0.15s ease, background-color 0.3s ease;
        }

        body.dark-theme .btn-dot {
            background-color: #ffffff;
        }

        .ui-icon-btn:active .btn-dot {
            transform: scale(0.85);
        }

        /* MOBILANPASSNING */
        @media (max-width: 768px) {
            body {
                cursor: auto;
            }
            #custom-cursor {
                display: none;
            }

            .ui-icon-btn {
                cursor: pointer;
            }

            /* DÖLJ FULLSKÄRMSKNAPPEN PÅ MOBIL */
            #fullscreen-btn {
                display: none !important;
            }

            #ui-controls {
                top: 14px;
                right: 14px;
                gap: 18px;
            }

            .btn-label {
                font-size: 9px;
                height: 20px;
                margin-bottom: 6px;
            }

            .toggle-track {
                width: 16px;
                height: 34px;
            }

            .toggle-thumb {
                width: 12px;
                height: 12px;
            }

            .ui-icon-btn.active .toggle-thumb {
                transform: translateY(18px);
            }

            .btn-dot {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const bookElement = document.getElementById('book');
            const toggleModeBtn = document.getElementById('toggle-mode-btn');
            const toggleThemeBtn = document.getElementById('toggle-theme-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');

            // Startläge baserat på stående vs liggande skärm
            const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
            if (isMobilePortrait) {
                document.body.classList.remove('mode-spread');
                document.body.classList.add('mode-single');
                toggleModeBtn.classList.add('active');
            } else {
                document.body.classList.remove('mode-single');
                document.body.classList.add('mode-spread');
                toggleModeBtn.classList.remove('active');
            }

            const pageFlip = new St.PageFlip(bookElement, {
                width: 450,
                height: 640,
                size: "stretch",
                minWidth: 100,
                maxWidth: 1000,
                minHeight: 140,
                maxHeight: 1400,
                maxShadowOpacity: 0.4,
                showCover: true,
                drawShadow: true,
                flippingTime: 500,
                usePortrait: true,
                mobileScrollSupport: false,
                startPage: 0
            });

            pageFlip.loadFromHTML(bookElement.querySelectorAll('.page'));

            // --- KNAPP 1: MODE (1 SIDA / UPPSLAG) ---
            toggleModeBtn.addEventListener('click', () => {
                if (document.body.classList.contains('mode-spread')) {
                    document.body.classList.remove('mode-spread');
                    document.body.classList.add('mode-single');
                    toggleModeBtn.classList.add('active');
                } else {
                    document.body.classList.remove('mode-single');
                    document.body.classList.add('mode-spread');
                    toggleModeBtn.classList.remove('active');
                }
                refreshLayout();
            });

            // --- KNAPP 2: THEME (LIGHT / DARK BACKGROUND) ---
            toggleThemeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-theme');
                toggleThemeBtn.classList.toggle('active');
            });

            // --- KNAPP 3: FULL SCREEN ---
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fullscreenBtn.classList.add('active');
                } else {
                    fullscreenBtn.classList.remove('active');
                }
            });

            // --- UPPDATERA STORLEK VID RENSNING/SKÄRMÄNDRING ---
            function refreshLayout() {
                setTimeout(() => {
                    if (pageFlip) pageFlip.update();
                }, 100);
            }
            window.addEventListener('resize', refreshLayout);
            window.addEventListener('orientationchange', refreshLayout);

            // --- SCROLL- OCH PINCH-ZOOM LOGIK ---
            const bookContainer = document.getElementById('book-container');
            const wrapper = document.getElementById('book-wrapper');
            
            let scale = 1;
            let posX = 0;
            let posY = 0;
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let initialPinchDist = null;

            let touchStartTime = 0;
            let touchStartX = 0;
            let touchStartY = 0;

            function updateTransform() {
                bookContainer.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            }

            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                const newScale = scale * zoomFactor;

                if (newScale >= 1 && newScale <= 3.5) {
                    scale = newScale;
                    if (scale <= 1.02) {
                        scale = 1;
                        posX = 0;
                        posY = 0;
                    }
                    updateTransform();
                }
            }, { passive: false });

            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartTime = Date.now();
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }

                if (e.touches.length > 1 || scale > 1.05) {
                    e.stopPropagation();
                }

                if (e.touches.length === 2) {
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                } else if (e.touches.length === 1 && scale > 1.05) {
                    isDragging = true;
                    startX = e.touches[0].clientX - posX;
                    startY = e.touches[0].clientY - posY;
                }
            }, { capture: true, passive: false });

            wrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1 || scale > 1.05) {
                    e.stopPropagation();
                }

                if (e.touches.length === 2 && initialPinchDist) {
                    e.preventDefault();
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const zoomFactor = currentDist / initialPinchDist;
                    const newScale = scale * zoomFactor;

                    if (newScale >= 1 && newScale <= 3.5) {
                        scale = newScale;
                        if (scale <= 1.02) {
                            scale = 1;
                            posX = 0;
                            posY = 0;
                        }
                        updateTransform();
                    }
                    initialPinchDist = currentDist;
                } else if (e.touches.length === 1 && isDragging && scale > 1.05) {
                    e.preventDefault();
                    posX = e.touches[0].clientX - startX;
                    posY = e.touches[0].clientY - startY;
                    updateTransform();
                }
            }, { capture: true, passive: false });

            wrapper.addEventListener('touchend', (e) => {
                if (scale > 1.05) {
                    e.stopPropagation();
                } else if (touchStartTime > 0 && e.changedTouches.length === 1) {
                    const duration = Date.now() - touchStartTime;
                    const distX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                    const distY = Math.abs(e.changedTouches[0].clientY - touchStartY);

                    if (duration < 250 && distX < 15 && distY < 15) {
                        const clickX = e.changedTouches[0].clientX;
                        const screenWidth = window.innerWidth;
                        
                        if (clickX > screenWidth / 2) {
                            pageFlip.flipNext();
                        } else {
                            pageFlip.flipPrev();
                        }
                    }
                }

                isDragging = false;
                initialPinchDist = null;
                touchStartTime = 0;
            }, { capture: true });

            // --- MUSPEKARE (ENDAST DATOR) ---
            const cursor = document.getElementById('custom-cursor');

            document.addEventListener('mousemove', (e) => {
                cursor.style.left = `${e.clientX}px`;
                cursor.style.top = `${e.clientY}px`;
            });

            const interactiveElements = document.querySelectorAll('.ui-icon-btn, #book-container');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1.6)';
                });
                el.addEventListener('mouseleave', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                });
            });

            // --- PAPPERSLJUD ---
            function playPaperSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const bufferSize = audioCtx.sampleRate * 0.06;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1400;
                    filter.Q.value = 1.2;

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.06);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noise.start();
                } catch (e) {}
            }

            pageFlip.on('flip', () => {
                playPaperSound();
            });

            // --- TANGENTBORDSNAVIGERING ---
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    pageFlip.flipNext();
                } else if (e.key === 'ArrowLeft') {
                    pageFlip.flipPrev();
                }
            });
        });
    </script>
</body>
</html>
